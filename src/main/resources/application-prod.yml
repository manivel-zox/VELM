spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict

logging:
  level:
    root: WARN
    com.velmart: INFO
    org.hibernate: WARN
    org.springframework.security: WARN

velmart:
  data-seeder:
    enabled: true
