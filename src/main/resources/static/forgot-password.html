<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery — VELMART</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast-modal.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding: 60px 20px; display: flex; justify-content: center;">
    <div class="card" style="max-width: 460px; width: 100%; padding: 34px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 24px; font-weight: 800; color: var(--primary-navy); margin-bottom: 6px;">Reset Your Password</h1>
        <p style="color: var(--text-secondary); font-size: 14px;">Enter your email to receive a recovery code</p>
      </div>

      <!-- Step 1: Request Code -->
      <div id="forgot-step-1">
        <form onsubmit="event.preventDefault(); (async () => {
          const email = document.getElementById('forgot-email').value;
          const code = await Auth.forgotPassword(email);
          if (code) {
            document.getElementById('reset-email').value = email;
            document.getElementById('reset-token').value = code;
            document.getElementById('forgot-step-1').style.display = 'none';
            document.getElementById('forgot-step-2').style.display = 'block';
          }
        })();">
          <div class="form-group">
            <label class="form-label">Account Email Address</label>
            <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required />
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Generate Reset Code</button>
        </form>
      </div>

      <!-- Step 2: Submit Reset -->
      <div id="forgot-step-2" style="display: none;">
        <form onsubmit="event.preventDefault(); Auth.resetPassword(
          document.getElementById('reset-email').value,
          document.getElementById('reset-token').value,
          document.getElementById('reset-new-password').value
        );">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="reset-email" class="form-control" readonly />
          </div>

          <div class="form-group">
            <label class="form-label">Verification / Reset Code</label>
            <input type="text" id="reset-token" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label">New Password (Min 6 chars)</label>
            <input type="password" id="reset-new-password" class="form-control" minlength="6" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Update Password</button>
        </form>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 14px;">
        <a href="/login.html">&larr; Return to Sign In</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
