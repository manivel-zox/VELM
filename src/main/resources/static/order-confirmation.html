<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — VELMART</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast-modal.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding-top: 40px; padding-bottom: 70px; max-width: 800px;">
    <div id="confirmation-content" class="card" style="padding: 40px; text-align: center;">
      <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
      <h1 style="font-size: 28px; font-weight: 800; color: var(--primary-navy); margin-bottom: 8px;">Order Confirmed!</h1>
      <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 24px;">
        Thank you for shopping with VELMART. Your order has been placed and will be delivered via Cash on Delivery.
      </p>

      <div style="background: var(--accent-blue-light); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 30px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
          <span>Order ID:</span>
          <strong id="conf-order-id" style="font-family: monospace; font-size: 15px; color: var(--primary-navy);">Loading...</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
          <span>Payment Mode:</span>
          <strong>Cash on Delivery (Pending Courier Collection)</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
          <span>Order Total:</span>
          <strong id="conf-total" style="color: var(--accent-blue); font-size: 16px;">₹0.00</strong>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
          <span>Delivery Address:</span>
          <span id="conf-address" style="text-align: right; max-width: 380px;">-</span>
        </div>
      </div>

      <div style="display: flex; gap: 14px; justify-content: center;">
        <a href="/customer-dashboard.html?tab=orders" class="btn btn-primary">Track Order & History</a>
        <a href="/products.html" class="btn btn-secondary">Continue Shopping</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId');

      let order = null;
      const cached = sessionStorage.getItem('last_order');
      if (cached) {
        order = JSON.parse(cached);
      }

      if (!order && orderId) {
        try {
          const res = await API.get(`/api/customer/orders/${orderId}`);
          if (res && res.success && res.data) {
            order = res.data;
          }
        } catch (e) {}
      }

      if (order) {
        document.getElementById('conf-order-id').innerText = order.orderId;
        document.getElementById('conf-total').innerText = API.formatINR(order.totalAmount);
        if (order.deliveryAddressSnapshot) {
          const a = order.deliveryAddressSnapshot;
          document.getElementById('conf-address').innerText = `${a.recipientName}, ${a.addressLine1}, ${a.city} - ${a.postalCode}`;
        }
      } else if (orderId) {
        document.getElementById('conf-order-id').innerText = orderId;
      }
    });
  </script>
</body>
</html>
