<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Support — VELMART</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast-modal.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding-top: 40px; padding-bottom: 70px; max-width: 800px;">
    <div class="card" style="padding: 40px;">
      <h1 style="font-size: 28px; font-weight: 800; color: var(--primary-navy); margin-bottom: 8px;">Contact & Customer Care</h1>
      <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 30px;">
        Have a question about an order, seller registration, or watch specifications? We are here to help!
      </p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
        <div style="background: var(--bg-main); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 24px; margin-bottom: 6px;">📧</div>
          <strong style="color: var(--primary-navy);">Customer Support Email</strong>
          <div style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">support@velmart.com</div>
        </div>

        <div style="background: var(--bg-main); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 24px; margin-bottom: 6px;">📞</div>
          <strong style="color: var(--primary-navy);">Helpline (Mon - Sat)</strong>
          <div style="color: var(--text-secondary); font-size: 14px; margin-top: 4px;">+91 98765 43210 (9 AM - 7 PM IST)</div>
        </div>
      </div>

      <form onsubmit="event.preventDefault(); UI.showToast('Thank you! Your message has been received. Our team will contact you shortly.', 'success'); event.target.reset();">
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input type="text" class="form-control" required />
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" class="form-control" required />
        </div>

        <div class="form-group">
          <label class="form-label">Order Number (If applicable)</label>
          <input type="text" class="form-control" placeholder="e.g. VEL-ORD-20261009-1234" />
        </div>

        <div class="form-group">
          <label class="form-label">Message / Inquiry *</label>
          <textarea class="form-control" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
