<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart — VELMART</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast-modal.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <div class="section-header">
      <div>
        <h1 class="section-title">Shopping Cart</h1>
        <p class="section-subtitle">Review items in your persistent shopping bag</p>
      </div>
    </div>

    <div id="cart-container">
      <div class="loading-container">
        <div class="spinner spinner-dark"></div>
        <p>Loading your shopping cart...</p>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Cart.init();
    });
  </script>
</body>
</html>
