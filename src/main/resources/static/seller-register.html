<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell on VELMART — Seller Onboarding Application</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast-modal.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding: 60px 20px; display: flex; justify-content: center;">
    <div class="card" style="max-width: 540px; width: 100%; padding: 36px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="badge badge-warning" style="margin-bottom: 10px;">Grow Your Brand with Us</span>
        <h1 style="font-size: 24px; font-weight: 800; color: var(--primary-navy); margin-bottom: 6px;">Seller Registration</h1>
        <p style="color: var(--text-secondary); font-size: 14px;">Apply to list your products on VELMART across India</p>
      </div>

      <form onsubmit="event.preventDefault(); Auth.registerSeller({
        name: document.getElementById('seller-owner-name').value,
        email: document.getElementById('seller-reg-email').value,
        phone: document.getElementById('seller-reg-phone').value,
        password: document.getElementById('seller-reg-password').value,
        businessName: document.getElementById('seller-business-name').value,
        businessAddress: document.getElementById('seller-business-address').value,
        role: 'ROLE_SELLER'
      });">
        <div class="form-group">
          <label class="form-label">Owner / Contact Name *</label>
          <input type="text" id="seller-owner-name" class="form-control" placeholder="e.g. Rajesh Sharma" required />
        </div>

        <div class="form-group">
          <label class="form-label">Registered Business Name / Brand *</label>
          <input type="text" id="seller-business-name" class="form-control" placeholder="e.g. Royal Watches & Accessories Ltd" required />
        </div>

        <div class="form-group">
          <label class="form-label">Business Email Address *</label>
          <input type="email" id="seller-reg-email" class="form-control" placeholder="seller@business.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Business Phone Number *</label>
          <input type="tel" id="seller-reg-phone" class="form-control" placeholder="+91 9876543210" required />
        </div>

        <div class="form-group">
          <label class="form-label">Warehouse / Business Address *</label>
          <textarea id="seller-business-address" class="form-control" placeholder="Full operating or warehouse address" required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="seller-reg-password" class="form-control" placeholder="••••••••" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-navy btn-lg btn-block" style="margin-top: 10px;">
          Submit Seller Application
        </button>

        <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
          Already registered as a seller? <a href="/seller-login.html" style="font-weight: 600;">Sign in here</a>
        </div>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
