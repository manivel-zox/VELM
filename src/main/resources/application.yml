spring:
  application:
    name: velmart
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # MySQL DataSource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:velmart_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT_MINUTES:60}m
      cookie:
        name: VELMART_JSESSIONID
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

velmart:
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@velmart.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@Velmart2026!}
    initial-name: ${ADMIN_INITIAL_NAME:Velmart Platform Admin}
  data-seeder:
    enabled: true
