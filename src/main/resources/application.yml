spring:
  application:
    name: velmart
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # MySQL DataSource Configuration (supports both standard and Railway environment variables)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:localhost}}:${MYSQL_PORT:${MYSQLPORT:3306}}/${MYSQL_DATABASE:${MYSQLDATABASE:velmart_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:${MYSQLUSER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:root}}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT_MINUTES:60}m
      cookie:
        name: VELMART_JSESSIONID
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

velmart:
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@velmart.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@Velmart2026!}
    initial-name: ${ADMIN_INITIAL_NAME:Velmart Platform Admin}
  data-seeder:
    enabled: true
