spring:
  application:
    name: velmart-test
  datasource:
    url: jdbc:h2:mem:velmart_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

velmart:
  admin:
    initial-email: admin@velmart.com
    initial-password: Admin@Velmart2026!
    initial-name: Velmart Platform Admin
  data-seeder:
    enabled: true
